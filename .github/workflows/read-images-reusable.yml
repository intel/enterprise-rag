---
name: Read image.yaml

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (branch, tag, or commit SHA) to checkout"
        required: false
        type: string
    outputs:
      matrix:
        description: "Matrix output from image list"
        value: ${{ jobs.read.outputs.matrix }}

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Read
        id: read
        run: |
          MATRIX=$(yq -o=json -I=0 '{"include": [.images | to_entries | .[] | {"name": .key, "dockerfile_dir": (.value.dockerfile_path | sub("/[^/]*$"; ""))} * .value]}' deployment/images.yaml)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
