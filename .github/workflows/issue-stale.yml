---
name: issue-stale

on:
  schedule:
    - cron: '0 4 * * 6'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 23
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          exempt-issue-labels: security
          close-issue-reason: not_planned
          operations-per-run: 100
          stale-issue-message: >
            This issue has had no activity for 23 days and is now marked `stale`.
            It will be closed in 7 days unless there is new activity. Comment to keep it open.
          close-issue-message: >
            Closed after 30 days without activity. Comment or reopen it if it still applies.
