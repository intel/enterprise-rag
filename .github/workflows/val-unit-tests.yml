name: "Val :: Unit tests"

on:
  push:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'
  pull_request:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs; every push to main/release keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Single stable check for branch protection, independent of matrix entries.
  unit-tests-result:
    name: "Unit tests result"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check unit test results
        run: |
          echo "ok"

