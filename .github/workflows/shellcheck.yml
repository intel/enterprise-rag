---
name: ShellCheck

# Actions are pinned to full commit SHAs (the trailing `# vX.Y.Z` is the tag
# that SHA corresponded to) and every tool to an exact version -- no floating
# tags. Version bumps are therefore explicit, reviewable changes to this file.
#
# Only GitHub-hosted runners and public actions are used. This is deliberate
# and is why these workflows live on the public branches only: internal CI runs
# on self-hosted runners that do not exist for this repository on github.com.
#
# Soft-fail for the initial rollout: findings publish to the job log instead of
# blocking the branch. Drop `continue-on-error` once the backlog is triaged.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'
  pull_request:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck (shell scripts)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installed from the pinned upstream release and checksum-verified rather
      # than via apt, whose version drifts with the runner image.
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          base="https://github.com/koalaman/shellcheck/releases/download"
          file="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "${base}/${SHELLCHECK_VERSION}/${file}" -o shellcheck.tar.xz
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 \
            "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Discovery reads shebangs as well as the *.sh suffix. Every shell script
      # tracked here currently carries the suffix, so the shebang arm finds
      # nothing today; it is kept so an extensionless script added later is not
      # silently skipped.
      #
      # -x plus the --source-path list makes ShellCheck follow `source`
      # statements. The list is required because the paths are built from
      # variables -- src/tests/e2e/benchmarks/chatqna/*.sh source
      # "${SCRIPT_DIR}/generate_uat_to_file.sh", which ShellCheck cannot
      # resolve unaided; without it the globals that helper sets read as
      # undefined in its callers.
      #
      # This is deliberately simpler than the equivalent workflow in the
      # inference repository, which post-filters SC2034 ("appears unused") hits
      # by checking whether another file reads the variable. SC2034 is a
      # warning, so --severity=error already suppresses it and that filtering
      # never runs. Lower the severity floor first if you want it back.
      - name: Run ShellCheck
        continue-on-error: true
        run: |
          mapfile -t files < <(
            git ls-files | while read -r f; do
              [ -f "$f" ] || continue
              case "$f" in *.sh) echo "$f"; continue ;; esac
              head -1 "$f" | grep -qE '^#!.*(bash|/sh|dash|ksh)' && echo "$f"
            done
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found."; exit 0
          fi

          mapfile -t dirs < <(printf '%s\n' "${files[@]}" | xargs -n1 dirname | sort -u)
          sp=()
          for d in "${dirs[@]}"; do sp+=(--source-path="$d"); done

          printf 'Scanning %s shell script(s)\n' "${#files[@]}"
          shellcheck -x "${sp[@]}" --severity=error --format=gcc "${files[@]}"
