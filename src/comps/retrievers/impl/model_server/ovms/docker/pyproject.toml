[project]
name = "Intel-Enterprise-RAG-Retriever-NER-OVMS"
version = "3.0.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "optimum-intel>=2.1.0,<3.0.0",
    "transformers>=5.10.0,<5.11",
    "torch>=2.13.0,<3.0.0",
    "nncf>=2.19.0,<3.0.0",
    "flask>=3.1.3,<4.0.0",
    "gunicorn>=23.0.0,<24.0.0",  
    "numpy>=1.26.4,<2.0.0",
    "scipy>=1.15.3,<2.0.0",
    "requests>=2.33.1,<3.0.0",
    "huggingface-hub>=1.3.0,<2.0.0",
    "urllib3>=2.8.0,<3.0.0",
]

[dependency-groups]
security-overrides = [
  "protobuf>=7.36.2,<8.0.0",
]

[tool.uv]
# Temporary: optimum-intel main already supports transformers>=5.10, drop this override once the next optimum-intel release ships.
override-dependencies = ["transformers>=5.10.0,<5.11"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
