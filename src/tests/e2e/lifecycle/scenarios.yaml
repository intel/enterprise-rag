scenarios:

  uninstall-by-layer:
    skip_auth_setup: true
    lifecycle:
      erag:
        - test_uninstall.py::test_uninstall_erag
      inference:
        - test_uninstall.py::test_uninstall_inference
      platform:
        - test_uninstall.py::test_uninstall_platform

  uninstall-full:
    skip_auth_setup: true
    lifecycle:
      - test_uninstall.py::test_uninstall

  install:
    markers: "smoke"

  install-all-at-once:
    markers: "smoke"

  upgrade:
    lifecycle:
      before-upgrade:
        - test_pre_upgrade.py
      after-upgrade:
        - test_post_upgrade.py

  update-llm-model:
    lifecycle:
      - test_update_llm_model.py
    markers: "smoke"

  update-reranker-model:
    lifecycle:
      - test_update_reranker_model.py
    markers: "smoke"

  update-embedding-model:
    lifecycle:
      before-update:
        - test_pre_update_embedding.py
      after-update:
        - test_update_embedding_model.py
    # Full smoke after the update only (the after-update phase); the snapshot-based EDP cleanup
    # keeps the pre-existing baseline document, so the re-ingest check is unaffected.
    markers:
      after-update: "smoke"

  backup-restore:
    lifecycle:
      before-backup:
        - test_pre_backup.py
      after-backup:
        - test_post_backup.py
      after-restore:
        - test_post_restore.py
