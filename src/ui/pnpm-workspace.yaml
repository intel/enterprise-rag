packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - "@parcel/watcher"
  - chromedriver
  - esbuild

# Security patches for transitive deps only — bump direct deps in package.json instead.
# Keep targets caret-bounded so an override can never pull in a new major.
overrides:
  chromedriver: 153.0.3
  "@humanfs/node@<0.16.8": ^0.16.8
  # optional peer of vite-plugin-dts, only needed for `rollupTypes` (unused);
  # it pulls in argparse@1 -> sprintf-js (GHSA-hp3w-g68c-fv3c, no fix)
  "@microsoft/api-extractor": "-"
  basic-ftp@<6.2.1: ^6.2.1
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  browserslist@<=4.28.6: ^4.28.7
  esbuild@<=0.24.2: ^0.25.0
  "@modelcontextprotocol/sdk@<1.32.0": ^1.32.0
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  follow-redirects@>=1.16.0 <1.16.1: ^1.16.1
  ip-address@<=10.7.3: ^10.7.4
  lodash@<4.18.0: ^4.18.0
  minimatch@>=10.0.0 <10.2.3: ^10.2.3
  postcss-selector-parser@>=6.1.0 <6.1.3: ^6.1.3
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  undici@>=7.0.0 <7.30.1: ^7.30.1
  undici@>=8.0.0 <8.12.2: ^8.12.2
  uuid@<11.1.1: ^11.1.1
  vite@<=6.4.3: ^6.4.4
  vitest@<3.2.6: ^3.2.6
