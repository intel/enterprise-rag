---
- name: "deployment_manifest | Delete manifest ConfigMap"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: "{{ manifest_name }}"
    namespace: "{{ manifest_namespace }}"
  failed_when: false
