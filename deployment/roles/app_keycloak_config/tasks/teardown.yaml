---
# --- Phase 1: Delete the realm from Keycloak (via Job) ---

- name: "app_keycloak_config | Check if Keycloak is reachable"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    name: keycloak-service
    namespace: "{{ keycloak_namespace }}"
  register: _kc_svc
  failed_when: false

# The Service exists for as long as the namespace does, so on its own it says
# nothing about whether anything is listening. The realm-delete Job talks to
# Keycloak over HTTP, and Keycloak is only up once it can reach its database — so
# a teardown that follows a storage teardown finds the Service in place and the
# service itself down. Waiting for that Job then costs two and a half minutes and
# fails the whole layer teardown, taking the artifact cleanup below and every
# component after this one with it.
- name: "app_keycloak_config | Check whether Keycloak is serving"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: keycloak
    namespace: "{{ keycloak_namespace }}"
  register: _kc_sts
  failed_when: false

- name: "app_keycloak_config | Set realm-deletion reachability"
  ansible.builtin.set_fact:
    _kc_reachable: >-
      {{ ((_kc_svc.resources | default([])) | length > 0)
         and (((_kc_sts.resources | default([]))
               | map(attribute='status.readyReplicas')
               | map('default', 0) | first | default(0) | int) > 0) }}

- name: "app_keycloak_config | Delete realm via teardown Job"
  when: _kc_reachable | bool
  block:
    # The configuration may leave the image tag to the default in version.yaml.
    # Teardown does not load the solution settings, so the default is read here.
    - name: "app_keycloak_config | Load version metadata"
      ansible.builtin.include_vars:
        file: "{{ deployment_dir }}/version.yaml"
      when: default_image_tag is not defined

    - name: "app_keycloak_config | Set teardown variables"
      ansible.builtin.set_fact:
        teardown_job_name: "keycloak-teardown-{{ ansible_date_time.epoch }}"
        init_container_image: "{{ registry }}/enterprise-rag-init-container:{{ tag | default(default_image_tag) }}"
        keycloak_internal_url: "http://keycloak-service.{{ keycloak_namespace }}.svc:8080{{ erag_keycloak_path_prefix | default('') }}"

    - name: "app_keycloak_config | Ensure ServiceAccount exists for teardown Job"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: keycloak-configurator
            namespace: "{{ keycloak_namespace }}"

    - name: "app_keycloak_config | Generate teardown Job manifest"
      ansible.builtin.template:
        src: teardown-job.yaml.j2
        dest: "{{ rag_tmp_dir }}/keycloak-teardown-job.yaml"
        mode: '0600'

    - name: "app_keycloak_config | Apply teardown Job"
      kubernetes.core.k8s:
        state: present
        src: "{{ rag_tmp_dir }}/keycloak-teardown-job.yaml"
        wait: false

    - name: "app_keycloak_config | Wait for teardown Job to complete"
      kubernetes.core.k8s_info:
        api_version: batch/v1
        kind: Job
        name: "{{ teardown_job_name }}"
        namespace: "{{ keycloak_namespace }}"
      register: _td_job_status
      until: >
        (_td_job_status.resources | length > 0) and
        ((_td_job_status.resources[0].status.succeeded is defined and _td_job_status.resources[0].status.succeeded >= 1) or
        (_td_job_status.resources[0].status.failed is defined and _td_job_status.resources[0].status.failed >= 1))
      retries: 30
      delay: 5

    - name: "app_keycloak_config | Check teardown Job result"
      ansible.builtin.fail:
        msg: "Keycloak teardown Job failed. Check logs: kubectl logs -n {{ keycloak_namespace }} job/{{ teardown_job_name }}"
      when: >
        _td_job_status.resources[0].status.failed is defined and
        _td_job_status.resources[0].status.failed >= 1

- name: "app_keycloak_config | Realm deletion skipped"
  ansible.builtin.debug:
    msg: >-
      {{ ('Keycloak service not found in ' ~ keycloak_namespace
          ~ '. The realm may already be gone — the core teardown ran first.')
         if (_kc_svc.resources | default([])) | length == 0
         else ('Keycloak is in ' ~ keycloak_namespace ~ ' but has no ready replica, so the realm '
               ~ 'cannot be deleted through it and this teardown leaves it behind. It goes with '
               ~ 'the database: the realm lives in the shared cluster, so tearing that down or '
               ~ 'restoring over it removes the realm too. Continuing with the artifact cleanup.') }}
  when: not (_kc_reachable | bool)

# --- Phase 2: Clean up K8s artifacts ---

- name: "app_keycloak_config | Delete configurator RBAC and artifacts"
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ keycloak_namespace }}"
  loop:
    - { api: v1, kind: ServiceAccount, name: keycloak-configurator }
    - { api: rbac.authorization.k8s.io/v1, kind: Role, name: keycloak-configurator }
    - { api: rbac.authorization.k8s.io/v1, kind: RoleBinding, name: keycloak-configurator }
    - { api: v1, kind: ConfigMap, name: keycloak-configurator-script }
    - { api: v1, kind: Secret, name: keycloak-configurator-sensitive }
    - { api: v1, kind: Secret, name: erag-credentials }
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  failed_when: false

- name: "app_keycloak_config | Find configurator Jobs"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: "{{ keycloak_namespace }}"
    label_selectors:
      - "app.kubernetes.io/name=keycloak-configurator"
  register: _kc_cfg_jobs

- name: "app_keycloak_config | Delete configurator Jobs"
  kubernetes.core.k8s:
    api_version: batch/v1
    kind: Job
    name: "{{ item.metadata.name }}"
    namespace: "{{ keycloak_namespace }}"
    state: absent
    delete_options:
      propagationPolicy: Background
  loop: "{{ _kc_cfg_jobs.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: _kc_cfg_jobs.resources | default([]) | length > 0

# --- Phase 3: Remove Grafana SSO wiring ---

- name: "app_keycloak_config | grafana-sso | Look up platform Grafana Deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ grafana_oauth_deployment }}"
    namespace: "{{ grafana_oauth_namespace }}"
  register: _grafana_deploy_td
  failed_when: false

- name: "app_keycloak_config | grafana-sso | Remove SSO from platform Grafana"
  when: (_grafana_deploy_td.resources | default([])) | length > 0
  block:
    - name: "app_keycloak_config | grafana-sso | Delete grafana-sso-env Secret"
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        name: "{{ grafana_oauth_secret_name }}"
        namespace: "{{ grafana_oauth_namespace }}"

    - name: "app_keycloak_config | grafana-sso | Unwire Secret from Grafana + roll"
      kubernetes.core.k8s:
        state: patched
        merge_type: strategic-merge
        api_version: apps/v1
        kind: Deployment
        name: "{{ grafana_oauth_deployment }}"
        namespace: "{{ grafana_oauth_namespace }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  erag.intel.com/grafana-sso-config-hash: null
              spec:
                containers:
                  - name: grafana
                    envFrom: []
