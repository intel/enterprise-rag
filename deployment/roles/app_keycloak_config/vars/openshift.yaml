---
# OpenShift assigns the UID and fsGroup (restricted-v2): leave them unset where
# the post-renderer cannot reach (hooks, Jobs, pods rendered by an operator).
_keycloak_config_fixed_uids: false
# Grafana is the Grafana Operator's instance (core roles/observability); its
# grafana container already reads grafana_oauth_secret_name.
_keycloak_config_grafana_operator: true
