---
- name: "app_chat_history | Uninstall Helm chart"
  kubernetes.core.helm:
    name: "{{ chat_history_helm_release_name }}"
    namespace: "{{ chat_history_namespace }}"
    state: absent
    wait: true
    wait_timeout: "300s"

- name: "app_chat_history | Delete namespace"
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ chat_history_namespace }}"
