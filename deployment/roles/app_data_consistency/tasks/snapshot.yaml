    _dc_ch_skip_reason: >-
      {{ ('namespace ' ~ chat_history_namespace ~ ' is not present')
           if (_dc_ch_ns.resources | length == 0)
         else ('chat_history_enabled is false')
           if not (chat_history_enabled | bool)
         else ('data_consistency_check_chat_history is false')
           if not (data_consistency_check_chat_history | bool)
