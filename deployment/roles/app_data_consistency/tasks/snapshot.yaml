- name: "app_data_consistency | Snapshot — data platform: resolve guards"
  ansible.builtin.set_fact:
    _dc_edp_skip_reason: >-
      {{ ('namespace ' ~ edp_namespace ~ ' is not present')
           if (_dc_edp_ns.resources | length == 0)
         else ('edp_enabled is false')
           if not (edp_enabled | bool)
         else ('data_consistency_check_edp is false')
           if not (data_consistency_check_edp | bool)
         else '' }}

- name: "app_data_consistency | Snapshot — data platform: count files"
  when: _dc_edp_skip_reason | trim | length == 0
  block:
    - name: "app_data_consistency | Snapshot — data platform: resolve workload"
      ansible.builtin.include_tasks: resolve_workload.yaml
      vars:
