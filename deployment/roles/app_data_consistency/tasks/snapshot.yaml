---
# Collect a data consistency snapshot from every active data store.
# Sets fact: _data_snapshot (dict of per-store count, status, method, reason)
#
# Every store is optional. A namespace that is absent, a component that is
# disabled, a toggle the operator switched off, or a vector store this role
# cannot count is recorded as skipped together with the reason, never treated as
# empty. A store that is counted is counted by an in-cluster Job whose failure
# fails the run — a count is either measured or absent, never assumed.

- name: "app_data_consistency | Snapshot — initialize"
  ansible.builtin.set_fact:
    _data_snapshot: {}
    _snapshot_timestamp: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
    _snapshot_file_timestamp: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

# --- Vector store (Redis) ---
- name: "app_data_consistency | Snapshot — vector store: check namespace"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ vector_databases_namespace }}"
  register: _dc_vdb_ns
  failed_when: false

# Normalized first so the guard reads one value in every case. An environment
# that leaves vector_databases_vector_store out of its configuration gets this
# role's default; an environment that names the key but gives it no value gets
# an empty string, which is a stated skip rather than a store called "None".
- name: "app_data_consistency | Snapshot — vector store: resolve configured store"
  ansible.builtin.set_fact:
    _dc_vdb_store: "{{ vector_databases_vector_store | default('', true) | trim }}"

- name: "app_data_consistency | Snapshot — vector store: resolve guards"
  ansible.builtin.set_fact:
    _dc_vdb_skip_reason: >-
      {{ ('namespace ' ~ vector_databases_namespace ~ ' is not present')
           if (_dc_vdb_ns.resources | length == 0)
         else ('vector_databases_enabled is false')
           if not (vector_databases_enabled | bool)
         else ('data_consistency_check_vdb is false')
           if not (data_consistency_check_vdb | bool)
         else ('vector_databases_vector_store is set to no value')
           if (_dc_vdb_store | length == 0)
         else ('no counter for vector store ' ~ _dc_vdb_store)
           if (_dc_vdb_store not in data_consistency_redis_stores)
         else '' }}

- name: "app_data_consistency | Snapshot — vector store: count keys"
  when: _dc_vdb_skip_reason | trim | length == 0
  block:
    - name: "app_data_consistency | Snapshot — vector store: resolve workload"
      ansible.builtin.include_tasks: resolve_workload.yaml
      vars:
        dcw_store: vdb
        dcw_namespace: "{{ vector_databases_namespace }}"
        dcw_workload: "{{ data_consistency_vdb_statefulset }}"
        dcw_container: "{{ data_consistency_vdb_container }}"

    - name: "app_data_consistency | Snapshot — vector store: run query Job"
      ansible.builtin.include_tasks: query_job.yaml
      vars:
        dcj_store: vdb
        dcj_label: vector-store
        dcj_namespace: "{{ vector_databases_namespace }}"
        dcj_image: "{{ _dcw_image }}"
        dcj_script: query_vector_store.sh
        dcj_env:
          - name: REDISCLI_AUTH
            secret: "{{ data_consistency_vdb_secret_name }}"
            key: REDIS_PASSWORD
          - name: NAMESPACE
            value: "{{ vector_databases_namespace }}"
          - name: POD_BASENAME
            value: "{{ data_consistency_vdb_statefulset }}"
          - name: HEADLESS_SERVICE
            value: "{{ _dcw_service }}"
          - name: CLUSTER_NODES
            value: "{{ _dcw_replicas }}"
          - name: REDIS_PORT
            value: "{{ data_consistency_vdb_port }}"

    - name: "app_data_consistency | Snapshot — vector store: record"
      ansible.builtin.set_fact:
        _data_snapshot: >-
          {{ _data_snapshot | combine({'vdb': {
               'count': _dcj_count | int, 'status': 'ok',
               'method': 'redis DBSIZE summed over cluster masters'}}) }}

- name: "app_data_consistency | Snapshot — vector store: record skip"
  ansible.builtin.set_fact:
    _data_snapshot: >-
      {{ _data_snapshot | combine({'vdb': {
           'count': 0, 'status': 'skipped', 'method': 'none',
           'reason': _dc_vdb_skip_reason | trim}}) }}
  when: _dc_vdb_skip_reason | trim | length > 0

# --- Chat history (FerretDB on PostgreSQL documentdb) ---
