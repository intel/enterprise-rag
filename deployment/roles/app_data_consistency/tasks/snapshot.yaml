- name: "app_data_consistency | Snapshot — chat history: record skip"
  ansible.builtin.set_fact:
    _data_snapshot: >-
      {{ _data_snapshot | combine({'chat_history': {
           'count': 0, 'status': 'skipped', 'method': 'none',
