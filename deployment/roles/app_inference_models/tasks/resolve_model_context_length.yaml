---
# Read the LLM's context length (max_model_len) from the model server and hand it to
# DocSum as DOCSUM_MODEL_CONTEXT_LENGTH (see app_pipeline's values.yaml.j2).
#
# The LLM is reached through the AI gateway, which serves its own /v1/models list
# without max_model_len, so DocSum cannot discover it at runtime. The script asks the
# KServe workload service through the apiserver proxy instead.
#
# Best effort: when the value cannot be resolved (OVMS does not report it, or the
# proxy is blocked), llm_max_model_len stays empty and DocSum skips pre-validation -
# oversized 'stuff' requests are then rejected by the model server itself.

- name: "app_inference_models | Run resolve_model_context_length script"
  ansible.builtin.script:
    cmd: >-
      {{ role_path }}/files/resolve_model_context_length.py
      --model-name '{{ inference_endpoints.llm.model_name }}'
      --namespace '{{ inference_namespace }}'
    executable: python3
  environment:
    KUBECONFIG: "{{ kubeconfig | default(lookup('env', 'KUBECONFIG')) }}"
  register: _model_context_length_result
  changed_when: false

- name: "app_inference_models | Set LLM context length"
  ansible.builtin.set_fact:
    llm_max_model_len: "{{ (_model_context_length_result.stdout | from_json).model_context_length | default('') }}"

- name: "app_inference_models | Show LLM context length resolution result"
  ansible.builtin.debug:
    msg: >-
      {% if llm_max_model_len | string | length > 0 %}
      LLM context length: {{ llm_max_model_len }} tokens for model
      '{{ inference_endpoints.llm.model_name }}'
      {% else %}
      LLM context length unresolved
      ({{ (_model_context_length_result.stdout | from_json).reason | default('unknown') }});
      DocSum token pre-validation will be skipped
      {% endif %}
