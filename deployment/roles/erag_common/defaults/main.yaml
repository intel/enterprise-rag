---
# Shared by every eRAG role through meta/main.yaml. Defaults, not a fact, so they
# hold for every action and with --only, whatever ran before.
erag_openshift: "{{ cluster_distribution | default('kubernetes') == 'openshift' }}"

# OpenShift assigns the UIDs: drop the charts' fixed runAsUser/runAsGroup/fsGroup.
# role_path is the calling role's, so this resolves to deployment/scripts.
# Use as: post_renderer: "{{ erag_helm_post_renderer or omit }}"
erag_helm_post_renderer: "{{ (role_path ~ '/../../scripts/openshift_post_renderer.py') if erag_openshift | bool else '' }}"
