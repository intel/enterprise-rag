prometheus:
  url: http://kube-prometheus-stack-prometheus.monitoring.svc
  timeout: 30s

rules:
  default: false
  resources: []
  custom:
    - seriesQuery: '{__name__="edp_files_uploaded_total",service="edp-backend"}'
      seriesFilters: []
      resources:
        overrides:
          namespace:
            resource: namespace
          service:
            resource: service
      name:
        matches: ^edp_files_uploaded_total$
        as: "edp_backend_files_to_upload"
      metricsQuery: '(edp_files_uploaded_total{namespace="edp",service="edp-backend"} + edp_links_uploaded_total{namespace="edp",service="edp-backend"})'
    - seriesQuery: '{__name__="edp_files_text_extracting_total",service="edp-backend"}'
      seriesFilters: []
      resources:
        overrides:
          namespace:
            resource: namespace
          service:
            resource: service
      name:
        matches: ^edp_files_text_extracting_total$
        as: "edp_backend_files_active"
      metricsQuery: '(edp_files_uploaded_total{namespace="edp",service="edp-backend"} + edp_files_text_extracting_total{namespace="edp",service="edp-backend"} + edp_links_uploaded_total{namespace="edp",service="edp-backend"} + edp_links_text_extracting_total{namespace="edp",service="edp-backend"})'
    - seriesQuery: '{__name__="http_request_duration_seconds_sum", service="input-scan-svc"}'
      seriesFilters: []
      resources:
        overrides:
          namespace:
            resource: namespace
          service:
            resource: service
      name:
        matches: ^http_request_duration_seconds_sum$
        as: "http_request_duration_seconds_avg_input_scan"
      metricsQuery: 'avg(rate(http_request_duration_seconds_sum{service="input-scan-svc", namespace="chatqna", handler!~"/metrics|/v1/health_check|none"}[1m])) by (<<.GroupBy>>) / (0.001 + avg(rate(http_request_duration_seconds_count{service="input-scan-svc", namespace="chatqna", handler!~"/metrics|/v1/health_check|none"}[1m])) by (<<.GroupBy>>))'
    - seriesQuery: '{__name__="http_request_duration_seconds_sum", service="output-scan-svc"}'
      seriesFilters: []
      resources:
        overrides:
          namespace:
            resource: namespace
          service:
            resource: service
      name:
        matches: ^http_request_duration_seconds_sum$
        as: "http_request_duration_seconds_avg_output_scan"
      metricsQuery: 'avg(rate(http_request_duration_seconds_sum{service="output-scan-svc", namespace="chatqna", handler!~"/metrics|/v1/health_check|none"}[1m])) by (<<.GroupBy>>) / (0.001 + avg(rate(http_request_duration_seconds_count{service="output-scan-svc", namespace="chatqna", handler!~"/metrics|/v1/health_check|none"}[1m])) by (<<.GroupBy>>))'
