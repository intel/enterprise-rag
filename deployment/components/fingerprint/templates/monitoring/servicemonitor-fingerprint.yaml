apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fingerprint-svc
  labels:
    app.kubernetes.io/part-of: {{ .Chart.Name }}
    release: {{ .Release.Name }}
spec:
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fingerprint.name" . }}
  endpoints:
  - port: {{ .Values.service.name | quote }}
{{- end }}
