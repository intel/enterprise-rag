apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.textExtractor.nameOverride | default (include "helm-edp.fullname" .) }}
  labels:
    {{- include "helm-edp.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.textExtractor.replicas }}
  selector:
    matchLabels:
      {{- include "helm-edp.textExtractor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/text-extractor-config: {{ include (print $.Template.BasePath "/textExtractor/text-extractor-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "manifest.podLabels" (list .Values.textExtractor.nameOverride .) | nindent 6 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helm-edp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.textExtractor.nameOverride }}
          securityContext:
            {{- toYaml .Values.securityContextWithTemp | nindent 12 }}
          image: {{ .Values.textExtractor.repository }}/{{ .Values.textExtractor.name }}:{{ .Values.textExtractor.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.textExtractor.pullPolicy }}
          env:
          {{- if .Values.proxy.http_proxy }}
            - name: http_proxy
              value: {{ .Values.proxy.http_proxy }}
          {{- end }}
          {{- if .Values.proxy.https_proxy }}
            - name: https_proxy
              value: {{ .Values.proxy.https_proxy }}
          {{- end }}
          {{- if .Values.proxy.no_proxy }}
            - name: no_proxy
              value: {{ include "helm-edp.noProxyWithContainers" . | quote }}
          {{- end }}
            - name: REQUESTS_CA_BUNDLE
              value: /etc/ssl/certs/ca-certificates.crt
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          {{- if .Values.textExtractor.environment }}
            {{- toYaml .Values.textExtractor.environment | nindent 12 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: vector-database-config
            - configMapRef:
                name: edp-text-extractor-configmap
          ports:
            - name: http
              containerPort: 9398
              protocol: TCP
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          # Extractor saturates CPU with 12 Docling workers during heavy PDF
          # extraction; the FastAPI event loop can be delayed >1s under load,
          # so default timeoutSeconds: 1 fires false-positive probe failures.
          # Widen the timeouts so probes tolerate load spikes without killing
          # a healthy pod. failureThreshold * periodSeconds gives the total
          # grace window (~12 min liveness, ~45s readiness).
          livenessProbe:
            failureThreshold: 24
            httpGet:
              path: v1/health_check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: v1/health_check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          startupProbe:
            failureThreshold: 120
            httpGet:
              path: v1/health_check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            {{- $defaultValues := toYaml .Values.textExtractor.resources | nindent 12 -}}
            {{- include "manifest.getResource" (list .Values.textExtractor.nameOverride $defaultValues .Values) | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
