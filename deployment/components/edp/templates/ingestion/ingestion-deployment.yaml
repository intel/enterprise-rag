apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ingestion.nameOverride | default (include "helm-edp.fullname" .) }}
  labels:
    {{- include "helm-edp.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ingestion.replicas }}
  selector:
    matchLabels:
      {{- include "helm-edp.ingestion.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/ingestion/ingestion-configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "manifest.podLabels" (list .Values.ingestion.nameOverride .) | nindent 6 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "helm-edp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if eq .Values.ingestion.config.vector_store "redis" }}
          {{- include "redis_init_container" . | nindent 8 }}
        {{- else if eq .Values.ingestion.config.vector_store "redis-cluster" }}
          {{- include "redis_init_container" . | nindent 8 }}
        {{- else if eq .Values.ingestion.config.vector_store "pgvector" }}
          {{- include "postgresql_init_container" . | nindent 8 }}
        {{- else if eq .Values.ingestion.config.vector_store "mssql" }}
          {{- include "mssql_init_container" . | nindent 8 }}
        {{- end }}
      containers:
        - name: {{ .Values.ingestion.nameOverride }}
          env:
          {{- if .Values.proxy.http_proxy }}
            - name: http_proxy
              value: {{ .Values.proxy.http_proxy }}
          {{- end }}
          {{- if .Values.proxy.https_proxy }}
            - name: https_proxy
              value: {{ .Values.proxy.https_proxy }}
          {{- end }}
          {{- if .Values.proxy.no_proxy }}
            - name: no_proxy
              value: {{ include "helm-edp.noProxyWithContainers" . | quote }}
          {{- end }}
            - name: ERAG_LOGGER_LEVEL
              value: {{ .Values.celery.config.eragLoggerLevel | quote }}
          {{- if .Values.ingestion.environment }}
            {{- toYaml .Values.ingestion.environment | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: edp-ingestion-configmap
            - secretRef:
                name: vector-database-config
          securityContext:
            {{- toYaml .Values.securityContextWithTemp | nindent 12 }}
          image: {{ .Values.ingestion.repository }}/{{ .Values.ingestion.name }}:{{ .Values.ingestion.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.ingestion.pullPolicy }}
          ports:
            - name: http
              containerPort: 6120
              protocol: TCP
          volumeMounts:
            - mountPath: /tmp
              name: tmp
          livenessProbe:
            failureThreshold: 24
            httpGet:
              path: v1/health_check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 60
          readinessProbe:
            httpGet:
              path: v1/health_check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 60
          startupProbe:
            failureThreshold: 120
            httpGet:
              path: v1/health_check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 60
          resources:
            {{- $defaultValues := toYaml .Values.ingestion.resources | nindent 12 -}}
            {{- include "manifest.getResource" (list .Values.ingestion.nameOverride $defaultValues .Values) | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
