{{- define "milvus_init_container" -}}
- name: wait-for-milvus
  image: alpine/curl
  imagePullPolicy: IfNotPresent
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
  env:
    - name: VECTOR_STORE
      valueFrom:
        secretKeyRef:
          name: vector-database-config
          key: VECTOR_STORE
    - name: MILVUS_HOST
      valueFrom:
        secretKeyRef:
          name: vector-database-config
          key: MILVUS_HOST
  command:
    - sh
    - -c
    - |
        if [ -z "$MILVUS_HOST" ]; then
          echo "Environment variable MILVUS_HOST is not set. Skipping wait-for-milvus init container.";
          exit 1
        else
          until curl -sf "http://${MILVUS_HOST}:9091/healthz"; do
            echo "waiting for milvus server $MILVUS_HOST to be ready...";
            sleep 2;
          done;
        fi;
{{- end -}}
