apiVersion: v1
kind: Service
metadata:
  name: milvus
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/instance: milvus
spec:
  type: ClusterIP
  ports:
    - port: 19530
      targetPort: 19530
      protocol: TCP
      name: grpc
    - port: 9091
      targetPort: 9091
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/instance: milvus
{{- end }}
