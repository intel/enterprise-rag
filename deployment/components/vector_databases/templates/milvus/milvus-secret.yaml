apiVersion: v1
kind: Secret
metadata:
  name: milvus-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: milvus
    app.kubernetes.io/instance: milvus
type: Opaque
data:
  MILVUS_DB: {{ .Values.vector_database_name | default "vdb" | b64enc }}
  MILVUS_USERNAME: {{ .Values.vector_database_username | default "root" | b64enc }}
  MILVUS_PASSWORD: {{ .Values.vector_database_password | b64enc }}
{{- end }}
