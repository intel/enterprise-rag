kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: gmconnectors.gmc.erag.intel.com
spec:
  group: gmc.erag.intel.com
  names:
    kind: GMConnector
    listKind: GMConnectorList
    plural: gmconnectors
    shortNames:
    - gmc
    singular: gmconnectors
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.accessUrl
      name: URL
      type: string
    - jsonPath: .status.status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: GMConnector is the Schema for the gmconnectors API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GMConnectorSpec defines the desired state of GMConnector
            properties:
              nodes:
                additionalProperties:
                  properties:
                    routerType:
                      description: |-
                        RouterType


                        - `Sequence:` chain multiple steps with input/output from previous step


                        - `Ensemble:` routes the request to multiple destinations and then merge the responses


                        - `Switch:` routes the request to one of the steps based on condition
                      enum:
                      - Sequence
                      - Ensemble
                      - Switch
                      type: string
                    steps:
                      description: Steps defines destinations for the current router
                        node
                      items:
                        description: Step defines the target of the current step with
                          condition, weights and data.
                        properties:
                          condition:
                            description: routing based on the condition
                            type: string
                          data:
                            description: |-
                              request data sent to the next route with input/output from the previous step
                              $request
                              $response.predictions
                            type: string
                          dependency:
                            description: to decide whether a step is a hard or a soft
                              dependency in the Graph
                            enum:
                            - Soft
                            - Hard
                            type: string
                          externalService:
                            description: ExternalService URL, mutually exclusive with
                              InternalService.
                            type: string
                          internalService:
                            description: InternalService URL, mutually exclusive with
                              ExternalService.
                            properties:
                              config:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Config holds per-step settings passed to the service template.


                                  Two entries control fingerprint parameter injection:
                                    - "paramsKind" categorises the step's parameter group so the
                                      fingerprint store seeds the right defaults. It must be one of the
                                      kinds the fingerprint microservice serves from its catalog; the
                                      admission webhook fetches that catalog and rejects any other value,
                                      except that while it has never been able to fetch the catalog it
                                      admits any non-empty kind rather than block writes on a fingerprint
                                      outage. A step that omits it does not take part in parameter
                                      injection.
                                    - "paramsKey" names the group's row, letting two steps of the same kind
                                      (for example two llm steps) be addressed independently. It is
                                      optional and defaults to the lowercased step name when unset; set it
                                      explicitly only when a step needs a key that differs from its name.
                                type: object
                              isDownstreamService:
                                description: |-
                                  some service can automatically trigger another one in the pipeline
                                  if this field is not empty, means the downstream service will be invoked
                                type: boolean
                              serviceName:
                                type: string
                            type: object
                          name:
                            description: Unique name for the step within this node
                            type: string
                          nodeName:
                            description: The node name for routing as the next step.
                            type: string
                          serviceUrl:
                            description: |-
                              this is not for the users to set
                              when the service is ready, save the URL here for router to call
                            type: string
                        type: object
                      type: array
                  required:
                  - routerType
                  type: object
                type: object
              routerConfig:
                properties:
                  config:
                    additionalProperties:
